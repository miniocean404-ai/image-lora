[project]
name = "flymyai-lora-trainer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "accelerate==1.9.0",
  "bitsandbytes",
  "datasets==4.0.0",
  "diffusers",
  "einops==0.8.0",
  "huggingface-hub==0.34.3",
  "loguru==0.7.3",
  "matplotlib==3.10.5",
  "omegaconf==2.3.0",
  "onnxruntime==1.22.1",
  "opencv-python==4.12.0.88",
  "optimum-quanto==0.2.7",
  "peft==0.17.0",
  "qwen-vl-utils==0.0.11",
  "sentencepiece==0.2.0",
  "timm==1.0.19",
  "transformers==4.55.0",
  "torch==2.9.0",
  "torchaudio==2.9.0",
  "torchvision==0.24.0",
]

[tool.uv.sources]
diffusers = { git = "https://github.com/huggingface/diffusers", rev = "7a2b78bf0f788d311cc96b61e660a8e13e3b1e63" }
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

# 文档: https://uv.oaix.tech/guides/integration/pytorch/#_1
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
# 当设置 explicit = true 时，该索引将 不会 被自动用于解析未明确指定来源的依赖包。只有那些在 [tool.uv.sources] 中显式声明使用该索引的包，才会从这里查找
explicit = true
